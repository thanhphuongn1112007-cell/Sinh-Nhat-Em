<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chúc mừng sinh nhật Minh Thư 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sparkle"></canvas>

<section class="page active" id="p1">
  <h2 class="hint" id="hint">Chạm vào hộp quà nhé 🎁</h2>
  <div class="gift" id="gift"><div class="lid"></div><div class="box"></div><div class="ribbon"></div></div>
  <p class="typed" id="wish"></p>
  <button class="btn hidden" id="next1">Tiếp tục 💕</button>
</section>

<section class="page" id="p2">
  <h1 class="title">Hình ảnh đáng yêu của em</h1>
  <div class="gallery" id="gallery">
    <img src="Anh1.jpg" alt=""><img src="Anh2.jpg" alt=""><img src="Anh3.jpg" alt="">
    <img src="Anh4.jpg" alt=""><img src="Anh5.jpg" alt=""><img src="Anh6.jpg" alt=""><img src="Anh7.jpg" alt="">
  </div>
  <button class="btn hidden" id="next2">Tiếp tục 💕</button>
</section>

<section class="page" id="p3">
  <h1 class="title">Gửi Minh Thư 💌</h1>
  <div class="letter"><p class="typed" id="letter"></p></div>
  <p class="sign hidden" id="sign">— Thanh Phương —</p>
</section>

<script src="script.js"></script>
</body>
</html>
