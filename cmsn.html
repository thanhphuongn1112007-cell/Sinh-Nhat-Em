<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng sinh nhật Minh Thư</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--p1:#ffd1e3;--p2:#ff8fb8;--p3:#ff5c9a;--ink:#7a1f4a;--cream:#fff5f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Quicksand','Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffe3ef,#ffb6d1 55%,#ff9cc3);background-attachment:fixed;overflow-x:hidden}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1}
.page{display:none;position:relative;z-index:2;min-height:100vh;padding:28px 18px 60px;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.page.active{display:flex}
h1,h2{font-family:'Dancing Script','Brush Script MT',cursive;color:#d6247a;text-shadow:0 2px 12px #fff9}
h2{font-size:clamp(2rem,7vw,3.2rem);margin-bottom:18px}
.hint{font-weight:600;margin-top:18px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.45}}
#gift{background:none;border:0;cursor:pointer;width:min(62vw,230px);aspect-ratio:1;position:relative;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(-3deg)}}
#gift .box{position:absolute;left:8%;right:8%;bottom:4%;height:58%;background:linear-gradient(#ff7aa9,#f0457f);border-radius:8px;box-shadow:0 14px 28px #c2185b55}
#gift .lid{position:absolute;left:2%;right:2%;bottom:56%;height:20%;background:linear-gradient(#ff9bc0,#ff5c9a);border-radius:8px;transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
#gift .rb{position:absolute;left:44%;width:12%;bottom:4%;height:72%;background:#fff3b0;box-shadow:0 0 12px #fff}
#gift .bow{position:absolute;left:30%;width:40%;bottom:74%;height:22%;transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
#gift .bow:before,#gift .bow:after{content:"";position:absolute;top:0;width:52%;height:100%;border:7px solid #fff3b0;border-radius:50% 50% 50% 0}
#gift .bow:before{left:-4%;transform:rotate(-20deg)}
#gift .bow:after{right:-4%;transform:scaleX(-1) rotate(-20deg)}
#gift.open{animation:none}
#gift.open .lid,#gift.open .bow{transform:translateY(-120px) rotate(18deg);opacity:0;transition:transform .9s,opacity .9s}
#wish{font-family:'Dancing Script','Brush Script MT',cursive;font-weight:700;font-size:clamp(1.9rem,7.4vw,3.4rem);line-height:1.35;color:#d6247a;max-width:640px;text-shadow:0 2px 14px #fffc;min-height:5em}
#wish:after,#msg:after{content:"|";animation:pulse .8s infinite}
.done:after{content:""!important}
.btn{margin-top:26px;font:700 1.1rem 'Quicksand',sans-serif;color:#fff;background:linear-gradient(135deg,#ff7fb0,#e91e78);border:0;border-radius:999px;padding:14px 34px;cursor:pointer;box-shadow:0 8px 22px #e91e7855;opacity:0;pointer-events:none;transition:opacity 1s,transform .2s}
.btn.show{opacity:1;pointer-events:auto}
.btn:hover{transform:scale(1.06)}
.btn:focus-visible,#gift:focus-visible,#mute:focus-visible{outline:3px solid #fff;outline-offset:3px}
#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px;width:min(94vw,860px)}
.pol{background:#fff;padding:8px 8px 22px;border-radius:6px;box-shadow:0 10px 24px #b0124a44;opacity:0;transform:translateY(30px) scale(.85) rotate(0);transition:opacity 1.3s,transform 1.3s}
.pol.in{opacity:1;transform:rotate(var(--r))}
.pol img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px}
#mute{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:#fffc;font-size:1.3rem;cursor:pointer;display:none}
#msg{font-size:clamp(1.05rem,3.8vw,1.35rem);line-height:1.85;font-weight:600;max-width:640px;text-align:left;background:#fffb;padding:26px 24px;border-radius:22px;box-shadow:0 12px 34px #c2185b33;min-height:8em}
.sig{font-family:'Dancing Script',cursive;font-size:1.8rem;color:#d6247a;margin-top:18px;opacity:0;transition:opacity 2s}
.sig.show{opacity:1}
@media(prefers-reduced-motion:reduce){#gift{animation:none}.pol{transition:opacity .3s}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<button id="mute" aria-label="Bật hoặc tắt nhạc">🔊</button>

<section class="page active" id="p1">
  <button id="gift" aria-label="Mở hộp quà"><span class="box"></span><span class="rb"></span><span class="lid"></span><span class="bow"></span></button>
  <p class="hint" id="hint">Chạm vào hộp quà nhé 🎀</p>
  <p id="wish" hidden></p>
  <button class="btn" id="next1">Tiếp tục</button>
</section>

<section class="page" id="p2">
  <h2>Hình ảnh đáng yêu của em</h2>
  <div id="gallery"></div>
  <button class="btn" id="next2">Tiếp tục</button>
</section>

<section class="page" id="p3">
  <h2>Gửi Minh Thư</h2>
  <p id="msg"></p>
  <p class="sig" id="sig">Thanh Phương 💗</p>
</section>

const POS=['50% 60%','50% 30%','50% 35%','50% 40%','50% 35%','50% 40%','85% 88%'];
const WISH="Chúc em người con gái anh yêu tuổi mới thật hạnh phúc nhé iu em";
const MSG="Em à em biết không, em xinh lắm, em đáng yêu, đáng yêu tới mức anh có thể ngắm gương mặt em lúc ngủ cả ngày. Hôm nay là 1 ngày đặc biệt của em, ngày mà thiên thần nhỏ của anh ra đời, anh nghĩ rằng em có lẽ là người mà anh dành trọn tình cảm. Cảm ơn em vì những lần bỏ qua, cảm ơn em vì đã yêu anh, xin lỗi em vì anh không tốt như em mong muốn, nhưng anh biết anh cần phải cố gắng rất nhiều để sau này cưới em làm vợ, chưa ai cho anh cảm giác như em cả. Sau tất cả vẫn là em, yêu em.";
const $=id=>document.getElementById(id);

/* sparkles + floating hearts */
const cv=$('fx'),cx=cv.getContext('2d');let W,H,ps=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const COL=['#ffffff','#fff3b0','#ffd1e3','#ff8fb8'];
for(let i=0;i<70;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3+1,t:Math.random()*6,s:Math.random()*.02+.01,c:COL[i%4],h:i%7==0,vy:Math.random()*.3+.1});
function star(x,y,r,a){cx.globalAlpha=a;cx.beginPath();for(let k=0;k<8;k++){const q=k*Math.PI/4,d=k%2?r*.3:r*2.2;cx.lineTo(x+Math.cos(q)*d,y+Math.sin(q)*d)}cx.closePath();cx.fill()}
function heart(x,y,r,a){cx.globalAlpha=a;cx.font=(r*6)+'px serif';cx.fillText('♥',x,y)}
function loop(){cx.clearRect(0,0,W,H);for(const p of ps){p.t+=p.s*3;p.y-=p.vy;if(p.y<-20){p.y=H+20;p.x=Math.random()*W}
const a=.35+.65*Math.abs(Math.sin(p.t));cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=10;
p.h?(cx.fillStyle='#ff5c9a',heart(p.x,p.y,p.r,a*.8)):star(p.x,p.y,p.r,a)}
requestAnimationFrame(loop)}loop();
addEventListener('pointerdown',e=>{for(let i=0;i<8;i++)ps.push({x:e.clientX+(Math.random()-.5)*40,y:e.clientY+(Math.random()-.5)*40,r:Math.random()*3+1.5,t:0,s:.05,c:COL[i%4],h:i%3==0,vy:Math.random()*1.2+.4});if(ps.length>160)ps.splice(70,ps.length-160)});

/* typewriter */
function type(el,text,speed,cb){el.textContent='';el.classList.remove('done');let i=0;(function s(){if(i<text.length){el.textContent+=text[i++];setTimeout(s,speed)}else{el.classList.add('done');cb&&cb()}})()}
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}

/* Happy Birthday melody (WebAudio) */
let ac,playing=false,muted=false,timer;
const N={G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
const SONG=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
function playSong(){if(!playing||muted)return;const beat=.52;let t=ac.currentTime+.05;
for(const [n,b] of SONG){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=N[n];
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+b*beat);
o.connect(g).connect(ac.destination);o.start(t);o.stop(t+b*beat+.05);t+=b*beat}
timer=setTimeout(playSong,(t-ac.currentTime+1.2)*1000)}
function startMusic(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();playing=true;$('mute').style.display='block';playSong()}catch(e){}}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';clearTimeout(timer);if(!muted){playSong()}};

/* page 1 */
$('gift').onclick=()=>{const g=$('gift');if(g.classList.contains('open'))return;g.classList.add('open');$('hint').hidden=true;
for(let i=0;i<40;i++)ps.push({x:innerWidth/2,y:innerHeight/2,r:Math.random()*3+1.5,t:0,s:.05,c:COL[i%4],h:i%3==0,vy:Math.random()*3+1});
setTimeout(()=>{g.style.display='none';$('wish').hidden=false;type($('wish'),WISH,85,()=>setTimeout(()=>$('next1').classList.add('show'),600))},900)};

/* page 2 */
$('next1').onclick=()=>{go('p2');startMusic();const gal=$('gallery');gal.innerHTML='';
IMGS.forEach((b,i)=>{const d=document.createElement('div');d.className='pol';d.style.setProperty('--r',((i%2?1:-1)*(1+Math.random()*3)).toFixed(1)+'deg');
const im=new Image();im.src='data:image/jpeg;base64,'+b;im.alt='Minh Thư';im.style.objectPosition=POS[i];d.appendChild(im);gal.appendChild(d);
setTimeout(()=>d.classList.add('in'),700+i*1700)});
setTimeout(()=>$('next2').classList.add('show'),700+IMGS.length*1700)};

/* page 3 */
$('next2').onclick=()=>{go('p3');setTimeout(()=>type($('msg'),MSG,48,()=>$('sig').classList.add('show')),700)};
</script>
</body>
